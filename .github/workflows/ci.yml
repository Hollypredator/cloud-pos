name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Phase 2 Security Checks
        run: npm run phase2:checks

      - name: Phase 6 Observability Checks
        run: npm run phase6:observability

      - name: Phase 7 UAT Gate Checks
        run: npm run phase7:uat

      - name: Phase 8 Pilot Readiness Checks
        run: npm run phase8:pilot

      - name: Build
        run: npm run build

      - name: Start app
        run: |
          npm run start > app.log 2>&1 &
          echo $! > app.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "App did not become ready in time"
          cat app.log
          exit 1

      - name: Synthetic smoke check
        env:
          SYNTHETIC_BASE_URL: http://127.0.0.1:3000
        run: npm run monitor:synthetic

      - name: Phase 2 Runtime Tenant Checks
        if: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run phase2:runtime

      - name: Stop app
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" || true
          fi

  finance-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality-gate
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && secrets.STAGING_SUPABASE_URL != '' && secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Phase 4 Reconciliation Check (Staging)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          CASH_RECONCILIATION_DIFF_ALERT: ${{ vars.CASH_RECONCILIATION_DIFF_ALERT }}
        run: npm run phase4:reconciliation

  payment-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality-gate
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && secrets.STAGING_SUPABASE_URL != '' && secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Phase 5 Payment Consistency Check (Staging)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run phase5:consistency
